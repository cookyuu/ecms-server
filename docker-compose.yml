version: '3.8'

services:
  # MariaDB Database
  mariadb:
    image: mariadb:11.1
    container_name: ecms-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root1234}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-ecms_db_dev}
      MARIADB_USER: ${MARIADB_USER:-cookyuu}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-hk1234}
      TZ: Asia/Seoul
    ports:
      - "13306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - ecms-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: ecms-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis1234}
    ports:
      - "6389:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecms-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Application

#  app:
#    build:
#      context: .
#      dockerfile: Dockerfile
#    container_name: ecms-app
#    restart: unless-stopped
#    ports:
#      - "7777:7777"
#    environment:
#      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
#      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/${MARIADB_DATABASE:-ecms_db_dev}?characterEncoding=UTF-8&serverTimezone=UTC
#      SPRING_DATASOURCE_USERNAME: ${MARIADB_USER:-cookyuu}
#      SPRING_DATASOURCE_PASSWORD: ${MARIADB_PASSWORD:-hk1234}
#      SPRING_REDIS_HOST: redis
#      SPRING_REDIS_PORT: 6379
#      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis1234}
#      JWT_SECRET: ${JWT_SECRET:-TESTECMSSECRETKEYISJWTTESTTESTECMSSECRETKEYISJWTTEST}
#      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
#      TZ: Asia/Seoul
#    depends_on:
#      mariadb:
#        condition: service_healthy
#      redis:
#        condition: service_healthy
#    networks:
#      - ecms-network

  # Prometheus (Optional - for monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: ecms-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/rules.yml:/etc/prometheus/rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - ecms-network
    profiles:
      - monitoring

  # Grafana (Optional - for visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: ecms-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - ecms-network
    profiles:
      - monitoring

networks:
  ecms-network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
